apply plugin: 'net.fabricmc.fabric-loom'

base {
	archivesName = 'orbit-cosmetic'
}

// Development-only test harness (screenshots and diagnostics); never part of the released jar.
sourceSets {
	testmod {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"orbit_cosmetic" {
			sourceSet sourceSets.main
		}
		"orbit_cosmetic_testharness" {
			sourceSet sourceSets.testmod
		}
	}
	runs {
		configureEach {
			// A separate run directory keeps the dev orbit/ folder out of the source tree.
			runDir = '../run/client'
			vmArgs '-Xmx2G'
		}
		testClient {
			client()
			name = 'Test Client'
			source sourceSets.testmod
			programArgs '--quickPlayMultiplayer', 'localhost:25599', '--width', '960', '--height', '540'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	implementation project(':common')
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

jar {
	// Ship the shared library inside the mod jar.
	from(project(':common').sourceSets.main.output)
}
